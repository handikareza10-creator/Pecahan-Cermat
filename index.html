// Helper function untuk render pecahan vertikal (termasuk pecahan negatif)
function f(n, d) {
  let isNeg = false;
  if (typeof n === 'number' && typeof d === 'number') {
    if ((n < 0 && d > 0) || (n > 0 && d < 0)) isNeg = true;
    n = Math.abs(n);
    d = Math.abs(d);
  } else if (String(n).startsWith('-')) {
    isNeg = true;
    n = String(n).substring(1);
  }
  return `${isNeg ? '<span style="font-size:18px; font-weight:700; color:var(--navy); margin-right:2px;">-</span>' : ''}<span class="fraction"><span>${n}</span><span>${d}</span></span>`;
}

function mf(w, n, d) {
  let isNeg = false;
  if (w < 0) { isNeg = true; w = Math.abs(w); }
  return `${isNeg ? '<span style="font-size:18px; font-weight:700; color:var(--navy); margin-right:2px;">-</span>' : ''}<span class="mixed-fraction"><span class="whole">${w}</span><span class="fraction"><span>${n}</span><span>${d}</span></span></span>`;
}

// FPB Helper
function gcd(a, b) {
  a = Math.abs(a); b = Math.abs(b);
  while (b) { let t = b; b = a % b; a = t; }
  return a;
}

function drawCircleFraction(num, den) {
  let canvas = document.getElementById('gameCanvas');
  if (!canvas) return;
  let ctx = canvas.getContext('2d');
  let cx = 80, cy = 80, r = 70;
  ctx.clearRect(0, 0, 160, 160);

  let sliceAngle = (2 * Math.PI) / den;
  for (let i = 0; i < den; i++) {
    let start = i * sliceAngle - Math.PI / 2;
    let end = start + sliceAngle;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();

    if (i < num) {
      ctx.fillStyle = '#2563eb';
      ctx.fill();
    } else {
      ctx.fillStyle = '#e2e8f0';
      ctx.fill();
    }
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

      <li><b>Pengurangan:</b> Gunakan simbol <code>-</code> (Contoh: <code>3/4 - 1/2</code> atau <code>-2/3 - -1/4</code>)</li>
      <li><b>Perkalian:</b> Gunakan simbol <code>*</code> atau <code>x</code> (Contoh: <code>2/3 * 3/5</code> atau <code>-1/2 x -4/5</code>)</li>
      <li><b>Pembagian:</b> Gunakan simbol <code>/</code> atau <code>:</code> (Contoh: <code>3/4 : 2/3</code> atau <code>-5/6 / 2/3</code>)</li>
    </ul>
  </div>
  
  <label for="userQuery">Masukkan Soal Pecahan (Positif atau Negatif):</label>

  <div class="chatbox" id="tutorOutput">Hasil dan langkah penyelesaian akan ditampilkan di sini...</div>

function processTutor() {
  let q = document.getElementById('userQuery').value.trim();
  let out = document.getElementById('tutorOutput');
  if(!q) {
    out.textContent = "Silakan masukkan soal terlebih dahulu.";
    return;
  }

  // Normalisasi simbol perkalian (x -> *) dan pembagian (: -> /)
  let normalizedQ = q.replace(/x/gi, '*').replace(/:/g, '/');

  // Regex matcher untuk pecahan positif/negatif dan operator (+, -, *, /)
  let match = normalizedQ.match(/(-?\d+\/-?\d+)\s*([\+\-\*\/])\s*(-?\d+\/-?\d+)/);
  if(match) {
    let f1 = match[1], op = match[2], f2 = match[3];
    let [p1, q1] = f1.split('/').map(Number);
    let [p2, q2] = f2.split('/').map(Number);

    if (q1 === 0 || q2 === 0) {
      out.textContent = "Error: Penyebut pecahan tidak boleh nol (0).";
      return;
    }

    let resN, resD, steps = "";
    let displayOp = op === '*' ? '×' : op === '/' ? '÷' : op;

    if(op === '+') {
      resN = (p1 * q2) + (p2 * q1);
      resD = q1 * q2;
      steps = `1. Samakan penyebut: ${f('('+p1+'×'+q2+')','('+q1+'×'+q2+')')} + ${f('('+p2+'×'+q1+')','('+q2+'×'+q1+')')} = ${f(p1*q2,resD)} + ${f(p2*q1,resD)}<br>
               2. Jumlahkan pembilang: (${p1*q2}) + (${p2*q1}) = ${resN}<br>
               3. Hasil dasar: ${f(resN,resD)}`;
    } else if(op === '-') {
      resN = (p1 * q2) - (p2 * q1);
      resD = q1 * q2;
      steps = `1. Samakan penyebut: ${f('('+p1+'×'+q2+')','('+q1+'×'+q2+')')} - ${f('('+p2+'×'+q1+')','('+q2+'×'+q1+')')} = ${f(p1*q2,resD)} - ${f(p2*q1,resD)}<br>
               2. Kurangkan pembilang: (${p1*q2}) - (${p2*q1}) = ${resN}<br>
               3. Hasil dasar: ${f(resN,resD)}`;
    } else if(op === '*') {
      resN = p1 * p2;
      resD = q1 * q2;
      steps = `1. Kalikan pembilang dengan pembilang: (${p1}) × (${p2}) = ${resN}<br>
               2. Kalikan penyebut dengan penyebut: (${q1}) × (${q2}) = ${resD}<br>
               3. Hasil dasar: ${f(resN,resD)}`;
    } else if(op === '/') {
      resN = p1 * q2;
      resD = q1 * p2;
      steps = `1. Balik pecahan kedua dan lakukan perkalian: ${f(p1,q1)} × ${f(q2,p2)}<br>
               2. Kalikan pembilang & penyebut: ${f('('+p1+'×'+q2+')', '('+q1+'×'+p2+')')} = ${f(resN,resD)}`;
    }

    // Penyederhanaan Pecahan
    let commonGcd = gcd(resN, resD);
    let simpN = resN / commonGcd;
    let simpD = resD / commonGcd;

    if (simpD < 0) {
      simpN = -simpN;
      simpD = -simpD;
    }

    let simpText = "";
    if (commonGcd > 1 || resN < 0 || resD < 0) {
      simpText = `<br>4. Bentuk Sederhana: <b>${f(simpN, simpD)}</b>`;
    }

    out.innerHTML = `<b>Penyelesaian untuk ${f(p1,q1)} ${displayOp} ${f(p2,q2)}:</b><br><br>${steps}${simpText}`;
  } else {
    out.textContent = "Format tidak dikenali. Pastikan memasukkan soal pecahan seperti: -1/3 + 2/5, 3/4 - -1/2, -2/3 x 3/4, atau -5/6 : 2/3.";
  }
}

function go(page) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  if (quizTimer) clearInterval(quizTimer);
  if (gameTimer) clearInterval(gameTimer);

  if (page === 'home') {
    content.innerHTML = homeHTML;
  } else if (page === 'lessons') {
    content.innerHTML = renderLessons();
  } else if (page === 'quiz') {
    content.innerHTML = renderQuiz();
  } else if (page === 'games') {
    content.innerHTML = renderGame();
  } else if (page === 'tutor') {
    content.innerHTML = tutorHTML;
  }
  window.scrollTo({top: 0, behavior: 'smooth'});
}

document.querySelectorAll('nav button').forEach(b => {
  b.addEventListener('click', () => go(b.dataset.page));
});

go('home');
</script>
